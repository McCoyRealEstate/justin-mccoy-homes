<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Compare Homes | Jus3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#10243b;font:16px system-ui}header{background:#10243b;color:white;padding:26px max(20px,calc((100vw - 1100px)/2))}header a{color:#e4c48b}h1{margin:12px 0}main{max-width:1100px;margin:auto;padding:20px}.selectors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:6px;font-weight:650}select{width:100%;padding:12px;border:1px solid #aab8c5;border-radius:6px;background:white;color:#10243b;font:inherit}.scroll{overflow:auto;margin-top:24px}table{border-collapse:collapse;width:100%;background:white}th,td{padding:14px;text-align:left;border-bottom:1px solid #dce2e9;min-width:145px;vertical-align:top}th:first-child{min-width:120px}thead th{background:#10243b;color:white}a{color:#174b78}p{line-height:1.5}.notice{font-size:14px;color:#536579}button{font:inherit;padding:10px 16px;margin-top:14px;background:#10243b;color:white;border:0;border-radius:6px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c49b52;outline-offset:3px}
</style></head><body><header><a href="/">Jus3D · Home</a><h1>Compare Homes</h1><p>Find the home that fits your life.</p></header><main><p id="status" role="status">Loading current inventory…</p><div class="selectors" id="selectors"></div><button id="clear" hidden>Clear comparison</button><div class="scroll" id="results"></div><p class="notice">Prices, specifications and availability are subject to change. Confirm current details with your Lennar New Home Consultant. <a href="tel:+14075725398">Contact Justin McCoy</a>.</p></main><script>
(async()=>{
const status=document.getElementById('status'),selectors=document.getElementById('selectors'),results=document.getElementById('results'),clear=document.getElementById('clear');
const norm=v=>String(v??'').trim().toLowerCase(),money=v=>typeof v==='number'&&Number.isFinite(v)&&v>0?v.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}):'Confirm pricing',value=v=>v===null||v===undefined||v===''?'Confirm details':String(v);
try{
const response=await fetch('/data/verified-homepage.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory unavailable');const data=await response.json(),homes=data.D.h,dir=data.D.c;
const byId=new Map(homes.map(h=>[norm(h.lot),h]));if(byId.size!==homes.length||byId.has(''))throw Error('Inventory identity invalid');
const community=h=>{const c=dir[h.cm];return typeof c==='string'?c:Array.isArray(c)?String(c[0]??h.cm):c?.name??c?.community??h.cm};
let fresh=null;try{const f=await fetch('/data/inventory-freshness.json',{cache:'no-store'});if(f.ok)fresh=await f.json()}catch{}
const age=Date.now()-Date.parse(fresh?.verified_at);status.textContent=age>=0&&age<=10800000&&fresh?.verification_status==='complete'?'Select up to three homes. Inventory verification is current.':'Select up to three homes. Confirm current availability.';
const sorted=[...homes].sort((a,b)=>community(a).localeCompare(community(b))||String(a.pl).localeCompare(String(b.pl))||String(a.lot).localeCompare(String(b.lot)));
const picks=[];
for(let i=0;i<3;i++){const label=document.createElement('label');label.textContent='Home '+(i+1);const select=document.createElement('select');select.setAttribute('aria-label','Home '+(i+1));select.add(new Option('Select a home',''));for(const h of sorted)select.add(new Option(community(h)+' · '+h.pl+' · '+money(h.p)+' · '+h.lot,norm(h.lot)));label.append(select);selectors.append(label);picks.push(select);select.addEventListener('change',render)}
function render(){const chosen=picks.map(s=>s.value).filter(Boolean);for(const s of picks)for(const o of s.options)o.disabled=!!o.value&&o.value!==s.value&&chosen.includes(o.value);results.replaceChildren();const selected=chosen.map(id=>byId.get(id)).filter(Boolean);if(!selected.length)return;const table=document.createElement('table'),head=table.createTHead().insertRow();const cell=(row,tag,text)=>{const el=document.createElement(tag);el.textContent=text;row.append(el);return el};cell(head,'th','Home');for(const h of selected)cell(head,'th',value(h.pl));const body=table.createTBody();for(const [label,get] of [['Community',community],['Price',h=>money(h.p)],['Bedrooms',h=>value(h.bd)],['Bathrooms',h=>value(h.ba)],['Square feet',h=>value(h.sq)],['Garage spaces',h=>h.g>0?value(h.g):'Confirm details'],['Homesite',h=>value(h.lot)]]){const row=body.insertRow();cell(row,'th',label).scope='row';for(const h of selected)cell(row,'td',get(h))}const row=body.insertRow();cell(row,'th','Community page').scope='row';for(const h of selected){const td=cell(row,'td','');const a=document.createElement('a');a.textContent='Explore community';a.href='/communities/'+encodeURIComponent(h.cm)+'.html';td.append(a)}results.append(table)}
clear.hidden=false;clear.onclick=()=>{picks.forEach(s=>s.value='');render()};
}catch(e){status.textContent='Inventory comparison is temporarily unavailable. Please contact Justin for current details.';console.error(e)}
})();
</script></body></html>
