<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jus3D Homepage Redesign Preview</title><style>body{margin:0;background:#0a2035;color:white;font:16px system-ui;padding:40px}a{color:#d6bb86}</style></head><body><p>Loading the redesigned Jus3D homepage and existing inventory…</p><script>
(async function(){
try{
const response=await fetch('./index.html?preview_source='+Date.now(),{cache:'no-store'});
if(!response.ok)throw new Error('Homepage request returned '+response.status);
let html=await response.text();
const css="/* Jus3D unified interface — presentation layer only; inventory scripts and data unchanged. */\n:root{--bg:#f4f2ed;--tile:#fff;--tile-line:#e4e4df;--tile-shadow:0 12px 34px rgba(8,25,43,.08);--surface:#fff;--ink:#10283d;--muted:#657582;--line:#e1e4e5;--navy:#0a2035;--blue:#123b58;--blue-ink:#fff;--soft:#e9eef1;--hero1:#081b2d;--hero2:#163b57;--head:\"Plus Jakarta Sans\",\"Avenir Next\",system-ui,sans-serif}\nhtml{scroll-behavior:smooth}body{background:#f4f2ed;color:#10283d}button,a,input,select{font-family:inherit}\n.hero{background:radial-gradient(circle at 86% 12%,rgba(207,173,115,.15),transparent 32%),linear-gradient(122deg,#071827 0%,#112f49 67%,#183e58 100%)!important;color:#fff!important;border-radius:0!important;padding-top:70px!important;padding-bottom:70px!important;position:relative;overflow:hidden}\n.hero:before{content:\"\";position:absolute;right:-140px;top:-160px;width:650px;height:650px;border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none;box-shadow:0 0 0 95px rgba(255,255,255,.025),0 0 0 190px rgba(255,255,255,.02)}\n.hero-grid{position:relative;z-index:1;align-items:center!important;gap:48px!important}\n.hero h1{font-family:Georgia,\"Times New Roman\",serif!important;font-size:clamp(43px,5.5vw,82px)!important;font-weight:400!important;line-height:1.08!important;letter-spacing:-.045em!important;max-width:780px}\n.hero h1 em{color:#d6bb86;font-style:normal}\n.hero .lede{color:#d2dce5!important;line-height:1.7!important;font-size:clamp(15px,1.5vw,18px)!important;max-width:680px}\n.hsearch{display:flex!important;gap:8px!important;padding:8px!important;background:#fff!important;border:1px solid rgba(255,255,255,.6)!important;border-radius:9px!important;box-shadow:0 18px 50px rgba(0,0,0,.18)!important;max-width:740px!important}\n.hsearch input{flex:1!important;min-width:0!important;border:0!important;background:#fff!important;color:#112b41!important;padding:15px 14px!important;font-size:15px!important;box-shadow:none!important}\n.hsearch button{border:0!important;border-radius:6px!important;background:#c6a46c!important;color:#0b1d2d!important;padding:13px 25px!important;font-weight:800!important}\n.agentcard{background:rgba(255,255,255,.97)!important;color:#10283d!important;border:1px solid rgba(255,255,255,.6)!important;border-radius:12px!important;box-shadow:0 22px 60px rgba(0,0,0,.17)!important;overflow:hidden}\n.agentcard .top{background:linear-gradient(130deg,#f6f5f0,#e9edf0)!important}\n.agentcard .headshot{object-fit:contain!important}\n.agentcard a[href^=\"tel:\"],.agentcard a[href^=\"mailto:\"]{overflow-wrap:anywhere}\n.stats{color:#d9e3ea!important}\n#ctl{background:#fff!important;border:1px solid #e0e5e6!important;border-radius:12px!important;box-shadow:0 8px 28px rgba(12,38,59,.06)!important}\n.filters select,#q{border:1px solid #d8dfe3!important;border-radius:7px!important;background-color:#fff!important;color:#17364b!important}\n#out{min-width:0}.tile,.home-card,.card,.community-card{border-radius:11px!important;border-color:#e0e4e4!important;box-shadow:0 10px 28px rgba(12,36,53,.07)!important;overflow:hidden}\n.btn.gold,.gold{background:#c6a46c!important;color:#0a1d2d!important}\n.refer{background:linear-gradient(120deg,#102c43,#081b2c)!important;color:#fff!important;border-radius:12px!important}\n.refer p{color:#d4dce4!important}\nbutton:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c6a46c!important;outline-offset:2px}\n@media(max-width:760px){.hero{padding-top:46px!important;padding-bottom:50px!important}.hero-grid{gap:28px!important}.hero h1{font-size:clamp(42px,10vw,60px)!important}.hsearch{padding:6px!important}.hsearch input{padding:13px 8px!important;font-size:14px!important}.hsearch button{padding:12px 16px!important}.agentcard{max-width:100%!important}#ctl{border-radius:8px!important}.filters{gap:8px!important}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n";
const injected='<style id="jus3d-preview-interface">'+css.replace(/<\\/g,'<\\/')+'</style>';
if(/<\\/head\\s*>/i.test(html)){html=html.replace(/<\\/head\\s*>/i,injected+'</head>');}
else{html=injected+html;}
document.open();document.write(html);document.close();
}catch(err){document.body.innerHTML='<h1>Preview unavailable</h1><p>The live homepage has not been modified.</p><pre></pre>';document.querySelector('pre').textContent=String(err);}
})();
</script></body></html>
