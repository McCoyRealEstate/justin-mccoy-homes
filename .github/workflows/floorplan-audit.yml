name: Official floor plan source audit
on:
  workflow_dispatch:
  push:
    paths:
      - audit_floorplans.py
      - .github/workflows/floorplan-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python audit_floorplans.py
