name: Lennar Phase 5 - Listing and Photo Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Build fresh unpublished preview
        run: python build_lennar_preview.py
      - name: Verify missing listings, Coming Soon prices, and photo fallbacks
        run: python verify_lennar_preview.py
      - name: Check normalized JavaScript syntax
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          html=Path('lennar_preview/index-normalized-unpublished.html').read_text()
          soup=BeautifulSoup(html,'html.parser')
          scripts=[x.get_text() for x in soup.find_all('script') if not x.get('src') and x.get('type') not in ('application/json','application/ld+json')]
          Path('lennar_preview/normalized-scripts.js').write_text('\n;\n'.join(scripts))
          PY
          node --check lennar_preview/normalized-scripts.js
      - name: Upload verification reports and unpublished HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lennar-phase5-verification
          path: lennar_preview/
          if-no-files-found: warn
