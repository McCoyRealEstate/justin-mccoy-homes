name: Customer virtual tour playback
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
    inputs:
      tour_url:
        description: 'Optional exact active tour URL for targeted playback'
        required: false
        type: string
  workflow_run:
    workflows: ['Publish standalone Homepage V2']
    types: [completed]
concurrency:
  group: customer-tour-playback-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  playback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}-${{ matrix.engine }}
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Retrieve previous full playback evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p previous-tour
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow customer-tour-playback.yml --branch main --event workflow_run --status success --limit 5 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "customer-tour-$ENGINE" --dir previous-tour; then break; fi
          done
      - name: Open actual property tours
        env:
          ENGINE: ${{ matrix.engine }}
          TOUR_URL: ${{ inputs.tour_url }}
        run: |
          cat > playback.cjs <<'JS'
          const pw=require('playwright'),fs=require('fs');
          const origin='https://jus3d.com';
          const get=async p=>{const r=await fetch(origin+p,{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()};
          (async()=>{
            const [catalog,inventory]=await Promise.all([get('/data/virtual-tours.json'),get('/data/verified-homepage.json')]);
            const active=new Map(inventory.D.h.map(h=>[String(h.lot).toLowerCase(),h]));
            const groups=new Map();
            for(const t of catalog.tours){if(!groups.has(t.url))groups.set(t.url,new Set());for(const lot of t.homesites)groups.get(t.url).add(String(lot).toLowerCase())}
            const allTasks=[...groups].map(([url,lots])=>({url,lots:[...lots].filter(l=>active.has(l))})).filter(t=>t.lots.length);
            let previous=null;
            try{previous=JSON.parse(fs.readFileSync('previous-tour/customer-tour-report.json','utf8'));}catch(e){console.log('No previous playback baseline; checking all tours');}
            const prior=new Map((previous?.results||[]).map(r=>[r.url,JSON.stringify([...r.covered_lots].sort())]));
            const changed=allTasks.filter(t=>prior.get(t.url)!==JSON.stringify([...t.lots].sort()));
            const changedUrls=new Set(changed.map(t=>t.url));
            const ordered=[...changed,...allTasks.filter(t=>!changedUrls.has(t.url))];
            console.log('NEW OR CHANGED TOUR MAPPINGS',JSON.stringify(changed));
            const tasks=process.env.TOUR_URL?ordered.filter(t=>t.url===process.env.TOUR_URL):ordered;
            if(!tasks.length)throw Error('No active tours');
            const covered=new Set(allTasks.flatMap(t=>t.lots));
            const missing=[...active.keys()].filter(l=>!covered.has(l));
            const browser=await pw[process.env.ENGINE].launch();
            const results=[];let next=0;
            const retryResults=[];
            fs.mkdirSync('tour-evidence',{recursive:true});
            try{
              const runBatch=async(batch,output,round)=>Promise.all(Array.from({length:4},async()=>{
                while(next<batch.length){
                  const index=next++,t=batch[index],h=active.get(t.lots[0]);
                  const result={url:t.url,lot:h.lot,plan:h.pl,covered_lots:t.lots,engine:process.env.ENGINE,attempt:round};
                  const context=await browser.newContext(process.env.ENGINE==='webkit'?{...pw.devices['iPhone 13']}:{viewport:{width:1440,height:900}});
                  try{
                    const page=await context.newPage();
                    const errors=[];page.on('pageerror',e=>errors.push(String(e).slice(0,200)));
                    await page.goto(origin+'/?home='+encodeURIComponent(h.lot),{waitUntil:'domcontentloaded',timeout:25000});
                    const link=page.locator('#detail a.property-tour-launch');
                    await link.waitFor({state:'visible',timeout:15000});
                    result.actual_url=await link.getAttribute('href');
                    if(result.actual_url!==t.url){result.status='wrong_tour';throw Error('Unexpected tour URL')}
                    if(await link.getAttribute('target')!=='_blank')throw Error('Tour must open in new tab');
                    if(await page.locator('#detail iframe').count())throw Error('Unexpected embedded tour');
                    const start=Date.now();
                    // Intercept the external navigation to verify the customer handoff without provider delays.
                    await context.route(t.url,route=>route.fulfill({status:200,contentType:'text/html',body:'Tour handoff verified'}));
                    const [popup]=await Promise.all([page.waitForEvent('popup',{timeout:10000}),link.click()]);
                    await popup.waitForURL(t.url,{timeout:10000});
                    if(!await page.locator('#detail').isVisible())throw Error('Original property dialog lost');
                    result.status='direct_launch_verified';
                    result.elapsed_ms=Date.now()-start;
                    result.errors=errors;
                    result.screenshot='tour-evidence/'+round+'-'+index+'.png';
                    await link.screenshot({path:result.screenshot,timeout:5000}).catch(e=>{result.screenshot_error=String(e)});
                    await popup.close();
                  }catch(e){result.status=result.status||'property_or_viewer_error';result.error=String(e)}
                  finally{await context.close();output.push(result);console.log(JSON.stringify(result))}
                }
              }));
              await runBatch(tasks,results,1);
              const retry=tasks.filter(t=>results.some(r=>r.url===t.url&&r.status!=='direct_launch_verified'));
              next=0;
              if(retry.length)await runBatch(retry,retryResults,2);
            }finally{await browser.close()}
            const finalResults=[...new Map([...results,...retryResults].map(r=>[r.url,r])).values()];
            const counts={};for(const r of finalResults)counts[r.status]=(counts[r.status]||0)+1;
            fs.writeFileSync('customer-tour-report.json',JSON.stringify({engine:process.env.ENGINE,unique_tours:tasks.length,covered_homes:covered.size,missing_homes:missing,changed_tour_mappings:changed,baseline_available:!!previous,counts,results:finalResults,initial_attempts:results,retry_attempts:retryResults},null,2));
            console.log('CUSTOMER TOUR SUMMARY',JSON.stringify(counts));
            if([...results,...retryResults].some(r=>r.status==='wrong_tour')||finalResults.some(r=>r.status==='property_or_viewer_error'))throw Error('Property integration errors detected; inspect report');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node playback.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-tour-${{ matrix.engine }}
          path: |
            customer-tour-report.json
            tour-evidence/
