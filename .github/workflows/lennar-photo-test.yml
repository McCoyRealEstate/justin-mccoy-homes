name: Lennar Photo Download - READ ONLY Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Download and compress five sample Lennar photos - NEVER PUBLISH
        run: python test_lennar_photos.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lennar-photo-test
          path: lennar_photo_test.json
          if-no-files-found: warn
