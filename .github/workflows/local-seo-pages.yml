name: Local SEO Pages
on:
  push:
    branches: [main]
    paths:
      - generate_community_pages.py
      - generate_local_pages.py
      - .github/workflows/local-seo-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lennar-controlled-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate and validate location pages
        run: |
          python prepare_city_inventory.py index.html lennar_preview/city-inventory.json
          python generate_local_pages.py lennar_preview/city-inventory.json
          python generate_community_pages.py lennar_preview/city-inventory.json
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          assert len(list(Path('areas').glob('*.html'))) == 9
          ET.parse('sitemap.xml')
          for p in Path('areas').glob('*.html'):
            s=p.read_text()
            assert '<link rel="canonical"' in s
            assert '<h1>' in s
            assert 'https://jus3d.com/' in s
          PY
      - name: Confirm validation-only operation
        run: echo 'Production SEO pages are published by the verified Phase 8 refresh pipeline.'
