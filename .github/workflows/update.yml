
name: Refresh Lennar inventory

on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python update_inventory.py
      - name: Commit refreshed data
        run: |
          git config user.name 'inventory-bot'
          git config user.email 'inventory-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Refresh Lennar inventory' && git push)
