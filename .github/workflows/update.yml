name: Audit Lennar inventory (Version 6)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish changes after a successful dry run?'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: lennar-inventory-v6
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Audit or publish verified inventory
        run: |
          if [ '${{ inputs.publish }}' = 'true' ]; then
            python update_inventory.py --publish
          else
            python update_inventory.py
          fi
      - name: Commit if published
        if: inputs.publish == true
        run: |
          git config user.name 'inventory-bot'
          git config user.email 'inventory-bot@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Lennar inventory'
            git push
          fi
