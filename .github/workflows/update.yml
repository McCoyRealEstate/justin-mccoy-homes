name: Lennar Inventory - Automatic Refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified inventory changes?'
        required: true
        type: boolean
        default: false

  schedule:
    # Every two hours, at :30 UTC (GitHub Actions schedules use UTC).
    - cron: '30 */2 * * *'

permissions:
  contents: write

concurrency:
  group: lennar-inventory-v6
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Audit or publish verified inventory
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MANUAL_PUBLISH" = "true" ]; then
            python update_inventory.py --publish
          else
            python update_inventory.py
          fi

      - name: Commit verified inventory
        if: >-
          github.event_name == 'schedule' || inputs.publish == true
        run: |
          git config user.name 'inventory-bot'
          git config user.email 'inventory-bot@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Automatic Lennar inventory refresh'
            git push
          fi
