name: Lennar Inventory - Automatic Refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified inventory changes?'
        required: true
        type: boolean
        default: false

  schedule:
    # Eastern Time: 9:30 AM, 3:30 PM, 7:30 PM
    # Includes both EST and EDT candidate hours.
    - cron: '30 0,13,14,19,20,23 * * *'

permissions:
  contents: write

concurrency:
  group: lennar-inventory-v6
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Eastern schedule
        id: timing
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            ET_HOUR=$(TZ=America/New_York date +%H)
            if [[ "$ET_HOUR" == "09" || "$ET_HOUR" == "15" || "$ET_HOUR" == "19" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.timing.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.timing.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.timing.outputs.run == 'true'
        run: python -m pip install requests beautifulsoup4

      - name: Audit or publish verified inventory
        if: steps.timing.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MANUAL_PUBLISH" = "true" ]; then
            python update_inventory.py --publish
          else
            python update_inventory.py
          fi

      - name: Commit verified inventory
        if: >-
          steps.timing.outputs.run == 'true' &&
          (github.event_name == 'schedule' || inputs.publish == true)
        run: |
          git config user.name 'inventory-bot'
          git config user.email 'inventory-bot@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Automatic Lennar inventory refresh'
            git push
          fi
