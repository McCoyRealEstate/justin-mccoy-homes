name: Refresh Lennar inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *' # 9:30 AM EST; 10:30 AM EDT
permissions:
  contents: write
concurrency:
  group: lennar-inventory-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Import and validate public inventory
        run: python update_inventory.py
      - name: Commit only verified data
        run: |
          git config user.name 'inventory-bot'
          git config user.email 'inventory-bot@users.noreply.github.com'
          git add index.html data/inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Lennar inventory'
            git push
          fi
