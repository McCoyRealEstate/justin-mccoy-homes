name: Public page spacing regression
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish standalone Homepage V2"]
    types: [completed]
concurrency:
  group: page-spacing-regression-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
jobs:
  spacing:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          node --input-type=module <<'JS'
          import {chromium,webkit,devices} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://jus3d.com';
          const feed=await (await fetch(base+'/data/verified-homepage.json')).json();
          const paths=['/','/compare/','/collections/','/communities/','/areas/',...feed.D.c.map(c=>'/communities/'+c.id+'.html')];
          for(const [engine,options,expected] of [[chromium,{viewport:{width:1280,height:900}},36],[webkit,devices['iPhone 13'],24]]){
            const browser=await engine.launch();
            try{
              const page=await browser.newPage(options);
              for(const path of paths){
                const response=await page.goto(base+path,{waitUntil:'domcontentloaded'});
                assert.ok(response.ok(),path);
                const result=await page.evaluate(()=>{
                  const link=document.querySelector('link[href*="page-spacing.css"]');
                  const hero=document.querySelector('.hero');
                  const inner=hero?.querySelector(':scope > .hero-in');
                  const style=hero?getComputedStyle(inner||hero):null;
                  return {compact:hero?.classList.contains('community-title')??false,sheet:!!link?.sheet,top:style?parseFloat(style.paddingTop):null,bottom:style?parseFloat(style.paddingBottom):null};
                });
                assert.ok(result.sheet,path+' missing shared stylesheet');
                if(path==='/'){
                  const bounds=await page.evaluate(()=>{
                    const hero=document.querySelector('.hero');
                    const actions=document.querySelector('.hero-actions');
                    const search=document.querySelector('.search-shell');
                    return {heroBottom:hero.getBoundingClientRect().bottom,actionsBottom:actions?.getBoundingClientRect().bottom??null,searchTop:search.getBoundingClientRect().top};
                  });
                  assert.ok(bounds.searchTop>=bounds.heroBottom-1,'Search overlaps hero');
                  assert.equal(bounds.actionsBottom,null,'Redundant hero navigation returned');
                }
                if(result.top!==null){const target=result.compact?(expected===36?16:12):expected;assert.equal(result.top,target,path+' top');assert.equal(result.bottom,target,path+' bottom');}
                if(path.startsWith('/communities/')&&path.endsWith('.html')){
                  const cards=await page.locator('.home-card').evaluateAll(cards=>cards.map(c=>{const specs=c.querySelector('.home-specs');return {icons:specs?.querySelectorAll('svg').length,center:specs?getComputedStyle(specs).justifyContent:null,heading:c.querySelector('h3')?.textContent,cta:!!c.querySelector('.property-details-cta'),radius:parseFloat(getComputedStyle(c).borderTopLeftRadius)}}));
                  for(const card of cards){assert.equal(card.icons,3,path+' missing spec icons');assert.equal(card.center,'center',path+' spec alignment');assert.ok(!/Homesite/i.test(card.heading||''),path+' legacy heading');assert.ok(card.cta&&card.radius>=8,path+' card styling');}
                  console.log('Community card regression',path,cards.length);
                }
                console.log(engine.name(),path,JSON.stringify(result));
              }
            }finally{await browser.close();}
          }
          JS
