name: Community lifecycle regression
on:
  workflow_dispatch:
  push:
    branches: [main, 'maintenance/community-reporting-20261127']
    paths:
      - generate_community_pages.py
      - test_community_lifecycle.py
      - .github/workflows/community-lifecycle-regression.yml
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_community_lifecycle.py
