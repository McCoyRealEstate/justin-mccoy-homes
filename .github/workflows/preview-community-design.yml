name: Publish Community Design Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - generate_community_pages.py
      - generate_local_pages.py
      - .github/workflows/preview-community-design.yml
permissions:
  contents: write
concurrency:
  group: lennar-controlled-publish
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: proposed
          persist-credentials: false
      - name: Build preview from PR branch
        run: |
          cd proposed
          python -m py_compile generate_community_pages.py
          python generate_local_pages.py
          python generate_community_pages.py
          python - <<'PY'
          from pathlib import Path
          pages=list(Path('communities').glob('*.html'))
          assert len(pages)==6, len(pages)
          for page in pages:
              if page.name == 'index.html': continue
              html=page.read_text()
              assert 'class="home-card"' in html, page
              assert 'id="filter-plan"' in html, page
              assert 'Request a Virtual Tour' in html, page
              assert 'Your Next Chapter Starts Here.' in html, page
              assert 'Mccartney' not in html, page
          for page in pages:
              html=page.read_text()
              html=html.replace('<head>','<head><meta name="robots" content="noindex,nofollow">',1)
              page.write_text(html)
          PY
      - uses: actions/checkout@v6
        with:
          ref: main
          path: published
          persist-credentials: true
      - name: Publish isolated visual preview
        run: |
          mkdir -p published/preview/community-design
          cp proposed/communities/*.html published/preview/community-design/
          cd published
          git config user.name "McCoy Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add preview/community-design
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated community design preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Preview is separate from the live website.
