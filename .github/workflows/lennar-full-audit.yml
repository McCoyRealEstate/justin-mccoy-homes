name: Lennar Full Import - READ ONLY Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Audit all communities - NEVER PUBLISH
        run: python audit_lennar_full.py
      - name: Save complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lennar-full-audit
          path: lennar_full_audit.json
          if-no-files-found: warn
