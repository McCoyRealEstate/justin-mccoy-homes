name: Home comparison regression
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish standalone Homepage V2"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: home-comparison-regression-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select affected regression
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          run=True
          if os.environ['EVENT']=='workflow_run':
              try:
                  with urllib.request.urlopen('https://jus3d.com/data/build-version.json?selection='+os.environ['DEPLOY_RUN'],timeout=15) as response:
                      m=json.load(response)
                  selection=m['test_selection']
                  if str(m['run_id'])==os.environ['DEPLOY_RUN'] and selection['mode']=='targeted':
                      run='comparison' in selection['tests']
              except Exception as exc:
                  print('Full coverage fallback:',exc)
          print('Run regression:',run)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(run).lower()+'\n')
          PY
      - uses: actions/setup-node@v4
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '22'
      - run: npm install playwright
        if: steps.selection.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.selection.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
        if: steps.selection.outputs.run == 'true'
      - if: steps.selection.outputs.run == 'true'
        run: |
          node <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          (async()=>{
            for(const [engine,options] of [[chromium,{viewport:{width:1280,height:800}}],[webkit,devices['iPhone 13']]]){
              const browser=await engine.launch();
              try{
                const page=await browser.newPage(options);
                const response=await page.goto('https://jus3d.com/compare/?verify='+Date.now());
                if(!response.ok())throw Error('Comparison page unavailable '+response.status());
                const calculation=await page.evaluate(()=>{
                  const source=[...document.scripts].map(s=>s.textContent).find(s=>s.includes('function payment(h)'));
                  if(!source)throw Error('Payment calculation missing');
                  const extract=(start,end)=>source.slice(source.indexOf(start),source.indexOf(end,source.indexOf(start)));
                  const code=extract('const numeric=','for(let i=0;i<3;i++)');
                  const fields=Object.fromEntries(Object.entries({down:5,rate:5.5,term:30,tax:1,insurance:.5}).map(([k,v])=>[k,{value:String(v),checkValidity:()=>true}]));
                  const run=new Function('fields',code+';return {payment,fees}')(fields);
                  const h={p:310240,s:'M',collection_url:'/example',ownership:{source:'/example',tax:1,hoa:233,hoa_monthly:true,assessment:156,assessment_monthly:false}};
                  const full=run.payment(h),partial=run.payment({...h,ownership:{...h.ownership,assessment:null}});
                  const wrong=run.payment({...h,collection_url:'/different'});
                  fields.rate.value='0';const zero=run.payment(h);
                  return {full,partial,wrong,zero,fees:run.fees(h)};
                });
                if(Math.round(calculation.full.total)!==2455||!calculation.full.complete||Math.round(calculation.partial.total)!==2442||calculation.partial.complete||calculation.wrong.complete||calculation.fees.cdd!==13||!Number.isFinite(calculation.zero.total))throw Error('Comparison payment regression '+JSON.stringify(calculation));
                console.log('Comparison payment reference and unknown-fee tests passed');
                const selects=page.locator('#selectors select');
                await selects.nth(2).waitFor();
                const feed=await (await page.request.get('https://jus3d.com/data/verified-homepage.json')).json();
                const homes=feed.D.h.filter(h=>typeof h.p==='number'&&h.p>=10000&&h.p<=3000000&&h.np!==1&&h.np!==true&&!['S','C'].includes(h.s)).slice(0,3);
                if(homes.length!==3)throw Error('Insufficient priced homes');
                const ids=homes.map(h=>String(h.lot).trim().toLowerCase());
                for(let i=0;i<3;i++)await selects.nth(i).selectOption(ids[i]);
                if(await page.locator('thead th').count()!==4)throw Error('Expected three compared homes');
                const prices=await page.locator('tbody tr').filter({has:page.getByRole('rowheader',{name:'Price',exact:true})}).locator('td').allTextContents();
                for(let i=0;i<3;i++){const p=homes[i].p;if(typeof p==='number'&&p>0&&prices[i]!==p.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}))throw Error('Price mismatch')}
                if(!await selects.nth(1).locator('option').filter({hasText: /./}).evaluateAll((opts,id)=>opts.some(o=>o.value===id&&o.disabled),ids[0]))throw Error('Duplicate selection allowed');
                if(await page.locator('body').evaluate(e=>e.scrollWidth>innerWidth+2))throw Error('Page horizontal overflow');
                await page.reload();
                await selects.nth(2).waitFor();
                for(let i=0;i<3;i++)if(await selects.nth(i).inputValue()!==ids[i])throw Error('Saved selection lost');
                await page.goto('https://jus3d.com/compare/?home='+encodeURIComponent(ids[1])+'&home='+encodeURIComponent(ids[0]));
                await selects.nth(2).waitFor();
                if(await selects.nth(0).inputValue()!==ids[1]||await selects.nth(1).inputValue()!==ids[0]||await selects.nth(2).inputValue()!=='')throw Error('Shared link restoration failed');
                await page.locator('#finance summary').click();
                const rate=page.locator('#finance-fields label').filter({hasText:/Interest Rate/}).locator('input');
                const paymentRow=page.locator('tbody tr').filter({has:page.getByRole('rowheader',{name:'Monthly payment estimate',exact:true})});
                const before=await paymentRow.locator('td').allTextContents();
                await rate.fill('4.99');
                const after=await paymentRow.locator('td').allTextContents();
                if(after.some(x=>!x.includes('/mo'))||JSON.stringify(before)===JSON.stringify(after))throw Error('Decimal rate failed '+JSON.stringify(after));
                await page.getByRole('button',{name:'Clear Comparison',exact:true}).click();
                await page.reload();
                await selects.nth(2).waitFor();
                if(await selects.nth(0).inputValue()!=='')throw Error('Cleared selection returned');
                if(await page.locator('#results table').count())throw Error('Clear failed');
                await page.goto('https://jus3d.com/?verify='+Date.now());
                await page.waitForFunction(()=>!!window.homeComparison);
                await page.evaluate(()=>window.homeComparison.write([]));
                if(await page.getByRole('complementary',{name:'Home comparison'}).count())throw Error('Obsolete floating comparison tray present');
                await page.evaluate(id=>{const a=document.createElement('a');a.href='/compare/?home='+id;document.body.append(a);a.click()},ids[0]);
                await page.waitForURL(u=>u.pathname==='/compare/');
                await page.waitForFunction(id=>document.querySelector('#selectors select')?.value===id,ids[0]);
                if(await page.evaluate(id=>!window.homeComparison.read().includes(id),ids[0]))throw Error('Direct comparison selection not saved');
                await page.reload();
                await page.waitForFunction(id=>document.querySelector('#selectors select')?.value===id,ids[0]);
                console.log('Direct comparison navigation and persistence passed',engine.name());
                await page.evaluate(()=>{localStorage.removeItem('jm-favorites-v1');window.homeComparison.write([])});
                await page.goto('https://jus3d.com/?verify='+Date.now());
                const favoriteToggle=page.locator('#favorites-toggle');
                await page.locator('#results [data-save]').first().waitFor();
                await page.waitForFunction(()=>document.querySelector('#favorites-toggle')?.textContent.includes('(0)'));
                for(let n=1;n<=3;n++){
                  await page.locator('#results [data-save][aria-pressed="false"]').first().click();
                  await page.waitForFunction(n=>document.querySelector('#favorites-toggle')?.textContent.includes('('+n+')'),n);
                }
                await page.reload();
                await page.waitForFunction(()=>document.querySelector('#favorites-toggle')?.textContent.includes('(3)'));
                await favoriteToggle.click();
                await page.getByRole('link',{name:'Compare Favorites'}).click();
                const favorites=page.locator('.favorite-picker');
                await favorites.getByRole('checkbox').nth(2).waitFor();
                for(let i=0;i<3;i++)await favorites.getByRole('checkbox').nth(i).check();
                if(await page.locator('thead th').count()!==4)throw Error('Favorites did not populate comparison');
                await favorites.getByRole('checkbox').first().uncheck();
                if(await page.locator('thead th').count()!==3)throw Error('Favorite comparison removal failed');
                if(await page.evaluate(()=>JSON.parse(localStorage.getItem('jm-favorites-v1')).length)!==3)throw Error('Comparison removed saved favorites');
                await page.getByRole('button',{name:'Clear Comparison',exact:true}).click();
                if(await favorites.getByRole('checkbox',{checked:true}).count())throw Error('Favorites selection not cleared');
                await page.goto('https://jus3d.com/?verify='+Date.now());
                await page.waitForFunction(()=>document.querySelector('#favorites-toggle')?.textContent.includes('(3)'));
                await page.locator('#favorites-toggle').click();
                for(let n=2;n>=0;n--){
                  await page.locator('#results [data-save][aria-pressed="true"]').first().click();
                  await page.waitForFunction(n=>document.querySelector('#favorites-toggle')?.textContent.includes('('+n+')'),n);
                }
                await page.reload();
                await page.waitForFunction(()=>document.querySelector('#favorites-toggle')?.textContent.includes('(0)'));
                console.log('Favorites integration passed',engine.name());

                console.log(engine.name()+' comparison passed');
              }finally{await browser.close()}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
