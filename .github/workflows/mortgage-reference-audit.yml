name: Mortgage reference audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mortgage-reference-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright && npx playwright install --with-deps chromium
      - run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch();
            const p=await b.newPage();
            await p.goto('https://www.lennarmortgage.com/calculators/monthly-payment-calculator',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(5000);
            console.log('FIELDS',JSON.stringify(await p.locator('input,select').evaluateAll(es=>es.map(e=>({id:e.id,name:e.name,type:e.type,value:e.value,label:e.labels?.[0]?.innerText,placeholder:e.placeholder,visible:!!e.getClientRects().length})))));
            console.log('PAGE', (await p.locator('body').innerText()).slice(0,16000));
            console.log('SCRIPTS',JSON.stringify(await p.locator('script[src]').evaluateAll(es=>es.map(e=>e.src))));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
