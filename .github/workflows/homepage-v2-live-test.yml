name: Live Homepage V2 smoke test
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish standalone Homepage V2']
    types: [completed]
    branches: [main]
  push:
    paths:
      - '.github/workflows/homepage-v2-live-test.yml'
permissions:
  contents: read
concurrency:
  group: homepage-v2-live-test-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
jobs:
  rehearsal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify public homepage on desktop and mobile
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          for(const [engine,viewport] of [[chromium,{width:1440,height:900}],[chromium,{width:390,height:844}],[webkit,{width:390,height:844}]]){
            const browser=await engine.launch();
            const page=await browser.newPage({viewport});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://jus3d.com/?verify='+Date.now());
            const feed=await page.request.get('https://jus3d.com/data/verified-homepage.json');
            if(!feed.ok())throw Error('Verified feed unavailable');
            const inventory=await feed.json();
            if(inventory.D.h.length<100||inventory.D.c.length<20)throw Error('Invalid inventory feed');
            if(await page.locator('link[rel=canonical]').getAttribute('href')!=='https://jus3d.com/')throw Error('Homepage canonical incorrect');
            if(!await page.locator('meta[name=description]').count())throw Error('Missing homepage description');
            if((await page.locator('meta[name=robots]').count())&&(await page.locator('meta[name=robots]').first().getAttribute('content')).includes('noindex'))throw Error('Homepage blocked from indexing');
            const source=await page.request.get('https://jus3d.com/inventory-source.html?verify='+Date.now());
            if(!source.ok()||!(await source.text()).includes('const D'))throw Error('Inventory source unavailable');
            const freshnessResponse=await page.request.get('https://jus3d.com/data/inventory-freshness.json?verify='+Date.now());
            if(!freshnessResponse.ok())throw Error('Inventory freshness metadata unavailable');
            const freshness=await freshnessResponse.json();
            const age=Date.now()-Date.parse(freshness.verified_at);
            const expected=age>=0&&age<=10800000&&freshness.verification_status==='complete'?'Inventory verified':'Confirm current availability';
            await page.waitForFunction(expected=>/^\d+ homes$/.test(document.querySelector('#count')?.textContent||'')&&document.querySelector('#inventory-checked')?.textContent.includes('Last updated')&&!document.querySelector('#inventory-checked')?.hidden,expected);
            console.log('Inventory freshness display verified: '+expected);
            const sort=page.locator('#sort'),fav=page.locator('#favorites-toggle');
            await sort.scrollIntoViewIfNeeded();
            const a=await sort.boundingBox(),b=await fav.boundingBox();
            if(!a||!b||a.x+a.width>b.x+1||Math.abs(a.y-b.y)>3||Math.abs(a.height-b.height)>3)throw Error('Sort/favorites overlap or misalignment');
            await sort.selectOption('high');await sort.selectOption('price');
            await fav.click();await fav.click();
            console.log('Sort and favorites layout verified '+engine.name()+' '+viewport.width);
            const counts=await page.locator('#community-count').innerText();
            const links=await page.locator('#community-results a').evaluateAll(a=>a.map(x=>x.getAttribute('href')));
            if(links.length<20||links.length!==parseInt(counts)||links.some(x=>!x.startsWith('/communities/')))throw Error('Community directory mismatch: '+counts);
            for(const link of links){if(!(await page.request.get('https://jus3d.com'+link)).ok())throw Error('Broken community link '+link);}
            const community=await browser.newPage({viewport});
            for(const link of links){
              await community.goto('https://jus3d.com'+link+'?verify='+Date.now());
              if(await community.locator('link[rel=canonical]').getAttribute('href')!=='https://jus3d.com'+link)throw Error('Community canonical mismatch '+link);
              if(await community.locator('body').evaluate(e=>e.scrollWidth>innerWidth+2))throw Error('Community horizontal overflow '+link);
              const slug=link.split('/').pop().replace(/\.html$/,'');
              const expectedHomes=inventory.D.h.filter(h=>h.cm===slug).length;
              const cards=community.locator('.home-card');
              if(expectedHomes===0){
                if(await cards.count()!==0||!await community.getByRole('heading',{name:/Still interested in/}).count()||!await community.getByRole('link',{name:'Inquire About Future Availability'}).count())throw Error('Zero inventory fallback missing '+link);
                console.log('ZERO INVENTORY FALLBACK VERIFIED '+link);
              }else if(await cards.count()!==expectedHomes)throw Error('Community inventory count mismatch '+link+' expected '+expectedHomes+' actual '+await cards.count());
              if(await cards.count()!==await community.locator('.home-card .listing-photo img').count())throw Error('Missing listing image '+link);
              const images=community.locator('.advisor-photo, .listing-photo img, .community-monument img');
              await images.evaluateAll(imgs=>imgs.forEach(i=>i.loading='eager'));
              await community.waitForFunction(()=>Array.from(document.querySelectorAll('.advisor-photo, .listing-photo img, .community-monument img')).every(i=>i.complete&&i.naturalWidth>0),{},{timeout:30000});
            }
            await community.close();
            if(await page.locator('iframe').count())throw Error('Unexpected iframe');
            if(await page.locator('body').evaluate(e=>e.scrollWidth>innerWidth+2))throw Error('Horizontal overflow');
            await page.locator('#results button[data-id]').first().click();
            if(!await page.locator('#detail').isVisible())throw Error('Listing dialog failed');
            await page.locator('#close').click();
            const media=await page.request.get('https://jus3d.com/data/floorplans.json?verify='+Date.now());
            if(media.ok()){
              const lib=await media.json();
              const lots=Object.keys(lib.lots);
              if(!lots.length)throw Error('Empty verified media library');
              console.log('Media coverage: '+lots.length+'/'+inventory.D.h.length+' homes; '+Object.keys(lib.models).length+' configurations; '+Object.values(lib.lots).filter(x=>x.tour).length+' tours');
              const lot=lots.find(k=>lib.lots[k].tour)||lots[0];
              await page.goto('https://jus3d.com/?home='+encodeURIComponent(lot)+'&verify='+Date.now());
              await page.locator('#detail').waitFor({state:'visible',timeout:30000});
              const floor=page.locator('#detail summary').filter({hasText:'View Floor Plan'});
              await floor.click({timeout:30000});
              const drawing=floor.locator('..').locator('img').first();
              await drawing.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>Array.from(document.querySelectorAll('#detail details[open] img')).some(i=>i.complete&&i.naturalWidth>0),{},{timeout:30000});
              await drawing.click();
              await page.getByRole('button',{name:'Close floor plan'}).click();
              if(lib.lots[lot].tour){
                const tour=page.locator('#detail summary').filter({hasText:'Virtual Tour'});
                await tour.click();
                const frame=tour.locator('..').locator('iframe');
                await frame.waitFor({state:'visible'});
                await page.waitForFunction(expected=>Array.from(document.querySelectorAll('#detail iframe')).some(f=>f.getAttribute('src')===expected),lib.lots[lot].tour,{timeout:15000});
                console.log('Tour iframe URL verified; provider rendering requires separate visual confirmation');
              }
              await page.locator('#close').click();
            }else console.log('Media library not deployed yet');
            if(errors.length)throw Error(errors.join('; '));
            console.log(viewport.width+'px: '+counts+'; '+await page.locator('#count').innerText());
            await page.close();
            await browser.close();
          }
          JS
