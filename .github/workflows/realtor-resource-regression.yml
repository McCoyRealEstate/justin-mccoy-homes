name: Realtor resource regression
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish standalone Homepage V2"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: realtor-resource-regression-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
jobs:
  resources:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select affected regression
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          run=True
          if os.environ['EVENT']=='workflow_run':
              try:
                  with urllib.request.urlopen('https://jus3d.com/data/build-version.json?selection='+os.environ['DEPLOY_RUN'],timeout=15) as response:
                      m=json.load(response)
                  selection=m['test_selection']
                  if str(m['run_id'])==os.environ['DEPLOY_RUN'] and selection['mode']=='targeted':
                      run='realtor' in selection['tests']
              except Exception as exc:
                  print('Full coverage fallback:',exc)
          print('Run regression:',run)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(run).lower()+'\n')
          PY
      - uses: actions/setup-node@v4
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '22'
      - run: npm install playwright
        if: steps.selection.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.selection.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
        if: steps.selection.outputs.run == 'true'
      - if: steps.selection.outputs.run == 'true'
        run: |
          node <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            for(const [engine,options] of [[chromium,{viewport:{width:1280,height:800}}],[webkit,devices['iPhone 13']]]){
              const browser=await engine.launch();
              try{
                const page=await browser.newPage(options);
                const response=await page.goto('https://jus3d.com/realtors/?verify='+Date.now());
                assert(response.ok(),'Realtor page unavailable');
                assert.equal(await page.locator('h1').innerText(),'Resources for your next sale.');
                assert.equal(await page.locator('main .card').count(),5);
                assert(!(await page.locator('body').evaluate(e=>e.scrollWidth>innerWidth+2)),'Horizontal overflow');
                for(const link of await page.locator('main a').all()){
                  assert(await link.isVisible(),'Hidden resource link');
                  const box=await link.boundingBox();assert(box.height>=44,'Touch target too small');
                  const href=await link.getAttribute('href');
                  assert(href,'Missing link');
                  if(href.startsWith('/')){
                    const target=new URL(href,page.url());
                    const result=await page.request.get(target.href);
                    assert(result.ok(),'Broken internal resource '+href);
                  }
                }
                const sms=await page.getByRole('link',{name:'Text for Current Incentives'}).getAttribute('href');
                assert.equal(sms,'sms:+14075725398'+(engine.name()==='webkit'?'&':'?')+'body='+encodeURIComponent("Hi Justin! Could you send me this week's current Lennar buyer incentives and Realtor commission opportunities? Thank you!"));
                assert.equal(await page.getByRole('link',{name:'Schedule a Tour'}).getAttribute('href'),'/appointments/');
                console.log(engine.name()+' Realtor resource checks passed');
              }finally{await browser.close()}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
