name: Lennar Phase 6 - Final Publishing Dry Run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Build fresh read-only inventory preview
        run: python build_lennar_preview.py
      - name: Verify missing listings and photo fallback
        run: python verify_lennar_preview.py
      - name: Prepare unpublished publishing diff
        run: python lennar_phase6_dry_run.py
      - name: Validate final candidate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          soup=BeautifulSoup(Path('lennar_preview/index-phase6-unpublished.html').read_text(), 'html.parser')
          scripts=[x.get_text() for x in soup.find_all('script') if not x.get('src') and x.get('type') not in ('application/json','application/ld+json')]
          Path('lennar_preview/phase6-inline-scripts.js').write_text('\n;\n'.join(scripts))
          PY
          node --check lennar_preview/phase6-inline-scripts.js
      - name: Upload report and unpublished candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lennar-phase6-dry-run
          path: lennar_preview/
          if-no-files-found: warn
