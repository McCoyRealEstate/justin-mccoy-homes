name: Floor plan viewer regression
on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish standalone Homepage V2"]
    types: [completed]
concurrency:
  group: floorplan-viewer-regression-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
jobs:
  mobile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select affected regression
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          run=True
          if os.environ['EVENT']=='workflow_run':
              try:
                  with urllib.request.urlopen('https://jus3d.com/data/build-version.json?selection='+os.environ['DEPLOY_RUN'],timeout=15) as response:
                      m=json.load(response)
                  selection=m['test_selection']
                  if str(m['run_id'])==os.environ['DEPLOY_RUN'] and selection['mode']=='targeted':
                      run='floorplan' in selection['tests']
              except Exception as exc:
                  print('Full coverage fallback:',exc)
          print('Run regression:',run)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(run).lower()+'\n')
          PY
      - uses: actions/setup-node@v4
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm install playwright
        if: steps.selection.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.selection.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
        if: steps.selection.outputs.run == 'true'
      - name: Exercise live viewer on mobile engines
        if: steps.selection.outputs.run == 'true'
        run: |
          node <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            for(const engine of [chromium,webkit]){
              const browser=await engine.launch();
              try{
                const page=await browser.newPage({...devices['iPhone 13']});
                await page.goto('https://jus3d.com/?test='+Date.now(),{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>typeof window.addOwnershipDetails==='function');
                const expectedName=await page.evaluate(async()=>{
                  const data=await fetch('/data/floorplans.json').then(r=>r.json());
                  const inventory=await fetch('/data/verified-homepage.json').then(r=>r.json());
                  const lot=Object.keys(data.lots).find(k=>{const floors=data.models[data.lots[k].model]?.floors;return floors?.length===1&&floors[0].variants.reversed&&inventory.D.h.some(h=>String(h.lot).toLowerCase()===k&&h.pl)});
                  if(!lot)throw Error('No reversible floor plan');
                  const body=document.createElement('div');document.body.append(body);
                  await window.addOwnershipDetails(body,lot);
                  return inventory.D.h.find(h=>String(h.lot).toLowerCase()===lot).pl;
                });
                const summary=page.locator('summary').filter({hasText:'View Floor Plan'}).last();
                await summary.click();
                await page.getByRole('heading',{name:expectedName,exact:true}).last().waitFor();
                await page.getByRole('button',{name:'Enlarge floor plan',exact:true}).first().click();
                const dialog=page.getByRole('dialog',{name:/floor plan viewer/});
                await dialog.waitFor();
                assert.equal(await dialog.locator('strong').first().textContent(),expectedName);
                const close=dialog.getByRole('button',{name:'Close floor plan'});
                const zoom=dialog.getByRole('slider',{name:'Floor plan zoom'});
                const before=await close.boundingBox();
                const bounds=await dialog.boundingBox();
                assert(before.x>bounds.x+bounds.width/2,'Close must be on right');
                await zoom.evaluate(el=>{el.value=200;el.dispatchEvent(new Event('input',{bubbles:true}))});
                const center=await zoom.evaluate(el=>{
                  const v=el.closest('dialog').querySelector('div[style*="overscroll-behavior"]');
                  return {x:(v.scrollLeft+v.clientWidth/2)/v.scrollWidth,y:(v.scrollTop+v.clientHeight/2)/v.scrollHeight};
                });
                assert(Math.abs(center.x-.5)<.08 && Math.abs(center.y-.5)<.08,JSON.stringify(center));
                const after=await close.boundingBox();
                assert(Math.abs(before.x-after.x)<2&&Math.abs(before.y-after.y)<2,'Close moved during zoom');
                const flip=dialog.getByRole('button',{name:'Reverse layout'});
                await flip.click();
                await dialog.getByRole('button',{name:'Original layout'}).click();
                await zoom.evaluate(el=>{el.value=100;el.dispatchEvent(new Event('input',{bubbles:true}))});
                await close.click();
                assert.equal(await dialog.count(),0);
                await page.route(/^https:\/\/(hd\.lennar\.com|my\.matterport\.com|tours\.mammothsteps\.com)\//,route=>route.fulfill({status:200,contentType:'text/html',body:'<html><body>Tour test fixture</body></html>'}));
                await page.evaluate(async()=>{
                  const data=await fetch('/data/floorplans.json').then(r=>r.json());
                  const lot=Object.keys(data.lots).find(k=>data.lots[k].tour);
                  if(!lot)throw Error('No tour available');
                  const body=document.createElement('div');body.id='tour-regression-fixture';document.body.append(body);
                  await window.addOwnershipDetails(body,lot,'mailto:test@example.com');
                });
                const fixture=page.locator('#tour-regression-fixture');
                await fixture.locator('summary').filter({hasText:'HOA & CDD Fees'}).waitFor();
                await fixture.locator('summary').filter({hasText:'Monthly Payment Calculator'}).waitFor();
                const tour=fixture.locator('a.property-tour-launch');
                await tour.waitFor({state:'visible'});
                const expected=await page.evaluate(async()=>{const d=await fetch('/data/floorplans.json').then(r=>r.json());return Object.values(d.lots).find(x=>x.tour).tour});
                assert.equal(await tour.getAttribute('href'),expected);
                assert.equal(await tour.getAttribute('target'),'_blank');
                assert.equal(await fixture.locator('iframe').count(),0);
                console.log('Direct tour link and floor plan controls passed',engine.name());
                console.log('Mobile viewer regression passed',engine.name());
              }finally{await browser.close()}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
