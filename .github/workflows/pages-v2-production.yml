          version=hashlib.sha256(asset.read_bytes()).hexdigest()[:12]
          # Discover public page entry points automatically; exclude historical previews and internal assets.
          excluded={'preview','assets','data','docs','.github','admin','command-center'}
          pages=sorted({root/'index.html',*(p for p in root.glob('*/index.html') if p.parent.name not in excluded and BeautifulSoup(p.read_text(),'html.parser').select_one('header .brand, header .logo')),*(root/'communities').glob('*.html'),*(root/'areas').glob('*.html')})
          assert root/'appointments/index.html' in pages, 'Appointment page missing shared design'
          for page in pages:
              if not page.is_file(): continue
              s=page.read_text()
              soup=BeautifulSoup(s,'html.parser')
              assert '</head>' in s.lower(), str(page)
              import re
              s=re.sub(r'</head>',lambda m:'<link rel="stylesheet" href="/assets/page-spacing.css?v='+version+'">'+m.group(0),s,count=1,flags=re.I)
              page.write_text(s)
          nav_version=hashlib.sha256((root/'assets/site-navigation.js').read_bytes()).hexdigest()[:12]
          for page in pages:
              if not page.is_file(): continue
              s=page.read_text()
              s=re.sub(r'</body>',lambda m:'<script defer src="/assets/site-navigation.js?v='+nav_version+'"></script>'+m.group(0),s,count=1,flags=re.I)
              for script in ['jm-language.js','shared-connect.js']:
                  sv=hashlib.sha256((root/'assets'/script).read_bytes()).hexdigest()[:12]
                  s=re.sub(r'<script\\b[^>]*src=["\\\']/?assets/'+re.escape(script)+r'(?:\\?[^"\\\']*)?["\\\'][^>]*>\\s*</script>','',s,flags=re.I)
                  s=re.sub(r'</body>',lambda m:'<script defer src="/assets/'+script+'?v='+sv+'"></script>'+m.group(0),s,count=1,flags=re.I)
              page.write_text(s)
          print('SHARED PAGE SPACING',version,len(pages))
