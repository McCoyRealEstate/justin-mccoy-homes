name: Publish standalone Homepage V2
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Lennar Phase 8 - Automatic Refresh (Every Hour)']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Install social preview renderer
        run: python -m pip install pillow requests beautifulsoup4
      - name: Restore verified media cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/jus3d-media-cache
          key: verified-media-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verified-media-v1-
      - name: Assemble tested standalone site
        env:
          MEDIA_CACHE_PATH: /tmp/jus3d-media-cache/media.json
        run: |
          mkdir -p /tmp/site
          git rev-parse HEAD > /tmp/jus3d-source-commit
          git archive HEAD | tar -x -C /tmp/site
          git fetch --depth=1 origin design/community-landing-pages
          mkdir -p /tmp/site/assets
          git show FETCH_HEAD:assets/justin-mccoy-headshot.webp > /tmp/site/assets/justin-mccoy-headshot.webp
          test -s /tmp/site/assets/justin-mccoy-headshot.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/site')
          source=(p/'index.html').read_bytes()
          (p/'inventory-source.html').write_bytes(source)
          import json,re,base64,hashlib
          html=source.decode('utf-8')
          def constant(k):
              m=re.search(r'(?m)^const\s+'+k+r'\s*=\s*',html)
              return json.JSONDecoder().raw_decode(html[m.end():])[0]
          feed={k:constant(k) for k in ('D','IMG','PH','PLANPH','HIMG','LU')}
          for home in feed['D']['h']:
              if str(home.get('pl','')).casefold()=='mccartney': home['pl']='McCartney'
          assert len(feed['D']['h'])>=100 and len(feed['D']['c'])>=20
          photos=p/'assets'/'inventory'
          photos.mkdir(parents=True,exist_ok=True)
          def externalize(v):
              if isinstance(v,str) and v.startswith('data:image/') and ';base64,' in v:
                  header,encoded=v.split(',',1)
                  raw=base64.b64decode(encoded,validate=True)
                  ext={'data:image/jpeg;base64':'jpg','data:image/png;base64':'png','data:image/webp;base64':'webp'}.get(header)
                  if not ext:return v
                  name=hashlib.sha256(raw).hexdigest()+'.'+ext
                  (photos/name).write_bytes(raw)
                  return '/assets/inventory/'+name
              return v
          feed['PH']=[externalize(v) for v in feed['PH']]
          for k in ('IMG','PLANPH','HIMG'):
              feed[k]={a:externalize(v) for a,v in feed[k].items()}
          (p/'data'/'verified-homepage.json').write_text(json.dumps(feed,separators=(',',':')))
          print('Inventory feed bytes:',(p/'data'/'verified-homepage.json').stat().st_size,'Legacy source bytes:',len(source))
          s=(p/'homepage-v2-preview.html').read_text()
          assert '/index.html?phase8=' in s
          s=s.replace('/index.html?phase8=', '/inventory-source.html?phase8=')
          s=s.replace('<meta name="robots" content="noindex">','<link rel="canonical" href="https://jus3d.com/">')
          s=s.replace('Homepage V2 Preview','Central Florida New Homes')
          (p/'index.html').write_text(s)
          assert (p/'inventory-source.html').read_bytes()==source
          assert '<iframe' not in s.lower()
          # Prevent duplicate legacy and preview pages from competing with the canonical homepage.
          (p/'inventory-source.html').write_text(re.sub(r'<head(?:\s[^>]*)?>',lambda m:m.group(0)+'<meta name="robots" content="noindex,follow">',source.decode('utf-8'),count=1,flags=re.I))
          (p/'homepage-v2-preview.html').write_text('<!doctype html><html><head><meta name="robots" content="noindex"><link rel="canonical" href="https://jus3d.com/"><meta http-equiv="refresh" content="0;url=/"></head><body><a href="/">Visit the homepage</a></body></html>')
          # Rebuild community pages from the exact inventory snapshot being published.
          import subprocess,sys
          snapshot='/tmp/jus3d-community-inventory.json'
          for script,args in [('prepare_city_inventory.py',['inventory-source.html',snapshot]),('generate_community_pages.py',[snapshot])]:
              subprocess.run([sys.executable,script,*args],cwd=p,check=True)
          from xml.etree import ElementTree as ET
          urls=[e.text for e in ET.parse(p/'sitemap.xml').findall('.//{*}loc')]
          assert len(urls)==len(set(urls))
          for url in urls:
              assert url.startswith('https://jus3d.com/')
              rel=url.removeprefix('https://jus3d.com/')
              target=p/(rel+'index.html' if not rel or rel.endswith('/') else rel)
              assert target.is_file(),url
          assert '<meta name="description"' in s and 'application/ld+json' in s
          assert (p/'og-preview.png').is_file()
          PY
          sudo apt-get update -qq && sudo apt-get install -y librsvg2-bin
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont,ImageOps
          from pathlib import Path
          p=Path('/tmp/site')
          im=Image.new('RGB',(1200,630),'#10263e')
          d=ImageDraw.Draw(im)
          gold='#d8b372'
          d.rectangle((0,0,12,630),fill=gold)
          def f(n,b=False,serif=False):
              return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/'+('DejaVuSerif' if serif else 'DejaVuSans')+('-Bold' if b else '')+'.ttf',n)
          d.text((60,55),'CENTRAL FLORIDA / NEW HOMES',font=f(22,True),fill=gold)
          d.text((56,112),'Find a home.',font=f(65,serif=True),fill='white')
          d.text((56,190),'Build your legacy.',font=f(58,serif=True),fill=gold)
          d.line((60,310,750,310),fill=gold,width=2)
          import re, subprocess, tempfile
          signature=re.search(r'<svg class="signature-mark"[^>]*>.*?</svg>',(p/'index.html').read_text(),re.S)
          assert signature, 'Approved signature missing'
          svg=signature.group().replace('currentColor','#ffffff').replace('viewBox="0 0 650 166"','width="650" height="166" viewBox="0 0 650 166"')
          with tempfile.TemporaryDirectory() as td:
              src=Path(td)/'signature.svg'; dst=Path(td)/'signature.png'
              src.write_text(svg)
              subprocess.run(['rsvg-convert','-o',str(dst),str(src)],check=True)
              sig=Image.open(dst).convert('RGBA')
              sig.thumbnail((470,120),Image.Resampling.LANCZOS)
              im.paste(sig,(60,330),sig)
          d.text((60,465),'New Home Consultant | Lennar Orlando',font=f(23),fill='#d3e0eb')
          d.text((60,550),'Jus3D.com',font=f(27,True),fill=gold)
          portrait=ImageOps.fit(Image.open(p/'assets/justin-mccoy-headshot.webp').convert('RGB'),(320,320))
          mask=Image.new('L',(320,320))
          ImageDraw.Draw(mask).ellipse((0,0,319,319),fill=255)
          d.ellipse((824,150,1160,486),fill=gold)
          im.paste(portrait,(832,158),mask)
          im.save(p/'og-justin-mccoy-v4.png',optimize=True)
          page=p/'index.html'
          page.write_text(page.read_text().replace('https://jus3d.com/og-preview.png','https://jus3d.com/og-justin-mccoy-v4.png').replace('Find a Home. Build Your Legacy. | Jus3D','Find a Home. Build Your Legacy. | Justin McCoy').replace('<meta name="twitter:card"','<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Justin McCoy, Lennar New Home Consultant in Central Florida"><meta name="twitter:card"'))
          PY
          python build_floorplan_library.py /tmp/site || echo 'Media enrichment unavailable; request buttons retained'
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          root=Path('/tmp/site')
          f=json.loads((root/'data/verified-homepage.json').read_text())
          def valid(v):
              if type(v) is int: return 0<=v<len(f['PH']) and valid(f['PH'][v])
              if not isinstance(v,str): return False
              if v.startswith('/assets/inventory/'): return (root/v.lstrip('/')).is_file()
              return v.startswith(('https://cdn.lennar.com/','https://lennar.bynder.com/','https://www.lennar.com/'))
          rows=[]
          for h in f['D']['h']:
              lot=str(h['lot'])
              key=h['cm']+'|'+str(h.get('pl','')).strip().lower()
              kind='missing'
              if any(valid(f['HIMG'].get(k)) for k in (lot,lot.lower(),lot.upper())): kind='listing'
              elif valid(f['PLANPH'].get(key)): kind='same_community_plan'
              elif valid(f['IMG'].get(h['cm'])): kind='community_monument'
              rows.append({'lot':lot,'community':h['cm'],'plan':h.get('pl'),'photo_source':kind})
          report={'counts':dict(Counter(r['photo_source'] for r in rows)),'homes':rows}
          (root/'data/photo-coverage.json').write_text(json.dumps(report,indent=2))
          print('PHOTO COVERAGE',json.dumps(report['counts']))
          PY
