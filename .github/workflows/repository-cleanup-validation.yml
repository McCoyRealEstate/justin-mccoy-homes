name: Repository cleanup validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [maintenance/repository-cleanup, main]
    paths:
      - '.github/workflows/repository-cleanup-validation.yml'
      - '.github/workflows/pages-v2-production.yml'
      - 'assets/**'
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'maintenance/repository-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected production sources and deleted-file references
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess,re
          from pathlib import Path
          base=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          changes=subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines()
          protected={'index.html','homepage-v2-preview.html','build_lennar_preview.py','verify_lennar_preview.py','lennar_phase6_dry_run.py','lennar_phase8_finalize.py','prepare_city_inventory.py','generate_local_pages.py','generate_community_pages.py','generate_city_experience.py','generate_property_previews.py','build_floorplan_library.py','assets/ownership-details.js','.github/workflows/lennar-phase8-auto-refresh.yml','.github/workflows/pages-v2-production.yml'}
          protected.update(str(p) for p in Path('assets').glob('*.js'))
          protected.update(str(p) for p in Path('assets').glob('*.css'))
          protected.add('assets/justin-mccoy-headshot.webp')
          assert subprocess.check_output(['git','hash-object','assets/justin-mccoy-headshot.webp'],text=True).strip() == 'f03f5c1446419a50165c55194e4268ad0881977d'
          deleted=set(subprocess.check_output(['git','diff','--diff-filter=D','--name-only',base,'HEAD'],text=True).splitlines())
          assert not deleted & protected, deleted & protected
          assert all(Path(p).is_file() for p in protected)
          # Exact path checks are a guard, not proof of absence of dynamic dependencies.
          patterns=[re.escape(p) for p in deleted if '/' in p or p.endswith(('.py','.js','.yml','.yaml','.html','.css'))]
          pattern=re.compile('|'.join(patterns)) if patterns else None
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          hits=[]
          for name in filter(None,paths):
              if name=='.github/workflows/repository-cleanup-validation.yml':continue
              p=Path(name)
              if p.suffix.lower() not in {'.html','.js','.py','.yml','.yaml','.json','.md','.css','.xml','.txt'}:continue
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if pattern and pattern.search(line):
                      hits.append((name,i,line[:200]))
          print('Dependency references:',hits)
          assert not hits,hits
          print('Reviewed deleted paths:',len(deleted))
          PY
      - name: Syntax checks
        run: |
          python -m compileall -q .
          for f in assets/*.js; do node --check "$f"; done
